[package]
name = "preflight"
description = "Aiken smart contract vulnerability auditor"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/tx3-lang/preflight"
homepage = "https://github.com/tx3-lang/preflight"

[dependencies]
aiken-lang = "1.1.21"
clap = { version = "4.5.36", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml_ng = "0.10"
miette = { version = "7.5.0", features = ["fancy"] }
reqwest = { version = "0.12.15", features = ["json"] }
tokio = { version = "1.45.0", features = ["rt-multi-thread", "macros"] }
chrono = "0.4.41"
cryptoxide = "0.5.0"
tempfile = "3.10"

[dev-dependencies]
tempfile = "3.10"

[lib]
name = "preflight"
path = "src/lib.rs"

[[bin]]
name = "preflight"
path = "src/main.rs"

[profile.dist]
inherits = "release"
lto = "thin"
